spring.application.name=itops-agent
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/itops_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__ticket_state_machine.sql,classpath:db/migration/V2__ai_context.sql
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler
mybatis-plus.global-config.db-config.update-strategy=not_null
